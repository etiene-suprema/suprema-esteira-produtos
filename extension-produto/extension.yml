schema_version: "1.0"

extension:
  id: produto
  name: "Desenho de Produto (Suprema)"
  version: "1.3.0"
  description: "Cinco passos da Trilha 1 da Esteira de Criação Suprema: perfis e atores, histórias de usuário com régua de prioridade, proposta e iteração da superfície do produto (interface ou jogo) com matriz de permissões e sinais de comportamento, validação por mockup navegável, e compilação da entrega em itens autossuficientes com origem, mais o PRD consolidado."
  category: "process"
  effect: "read-write"
  author: "Suprema Tech"
  license: "UNLICENSED"

requires:
  speckit_version: ">=1.0.0"

provides:
  commands:
    - name: "speckit.produto.perfis"
      file: "commands/speckit.produto.perfis.md"
      description: "Lista quem usa o produto e o que cada ator pode ver e fazer, incluindo operação, suporte e back-office. Vem antes da história; a tabela de perfis sai do desenho e nasce aqui"
    - name: "speckit.produto.historias"
      file: "commands/speckit.produto.historias.md"
      description: "Escreve as histórias de usuário com formato único, critério de tamanho e régua de prioridade (o que é P1, quem decide, o que P1 obriga adiante). Insumo do passo de especificar"
    - name: "speckit.produto.desenho"
      file: "commands/speckit.produto.desenho.md"
      description: "Propõe a superfície do produto e itera até a aprovação. Conjunto de seções por tipo: interface (navegação, telas, estados) ou jogo (contrato de evento, estados de rodada, aposta, carteira). Entrega também a matriz de permissões no formato da plataforma e os sinais de comportamento do produto"
    - name: "speckit.produto.mockup"
      file: "commands/speckit.produto.mockup.md"
      description: "Gera um mockup HTML navegável do desenho aprovado e conduz a entrevista de validação, devolvendo o que emergir para a especificação"
    - name: "speckit.produto.compilar"
      file: "commands/speckit.produto.compilar.md"
      description: "Compila os artefatos fragmentados em um arquivo autossuficiente por item de entrega, mais o PRD consolidado no formato da Suprema"

hooks:
  # Antes de especificar: perfis primeiro, histórias depois. Os dois passos novos da Trilha 1.
  before_specify:
    - command: "speckit.produto.perfis"
      priority: 5
      optional: true
      prompt: "Escrever perfis e atores agora (quem usa e o que cada um pode ver e fazer)?"
      description: "Trilha 1, passo 2 da Esteira de Criação Suprema"
      condition: null
    - command: "speckit.produto.historias"
      priority: 10
      optional: true
      prompt: "Escrever as histórias de usuário agora, com formato e régua de prioridade?"
      description: "Trilha 1, passo 3 da Esteira de Criação Suprema"
      condition: null

  # Depois de clarificar a spec, oferece a proposta de superfície.
  after_clarify:
    command: "speckit.produto.desenho"
    optional: true
    prompt: "Propor a superfície do produto agora (navegação, telas, ações, estados, permissões)?"
    description: "Trilha 1, passo 6 da Esteira de Criação Suprema"
    condition: null

  # Antes do portão de aceite: mockup primeiro, compilação depois.
  before_checklist:
    - command: "speckit.produto.mockup"
      priority: 5
      optional: true
      prompt: "Gerar o mockup navegável para validar o entendimento antes do aceite?"
      description: "Trilha 1, passo 7 da Esteira de Criação Suprema"
      condition: null
    - command: "speckit.produto.compilar"
      priority: 10
      optional: true
      prompt: "Compilar os itens de entrega e o PRD consolidado antes do aceite?"
      description: "Trilha 1, passo 8 da Esteira de Criação Suprema"
      condition: null

tags:
  - "produto"
  - "ux"
  - "mockup"
  - "prd"
  - "suprema"
